name: local-fork-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n bin/ccswitch && bash -n install.sh
      - run: python3 test/security.py
      - run: bash test/smoke.sh
      - run: bash test/keychain.sh
